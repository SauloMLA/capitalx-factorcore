version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: factorcore_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factorcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres_test:
    image: postgres:15-alpine
    container_name: factorcore_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factorcore_test
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  postgres_data:
